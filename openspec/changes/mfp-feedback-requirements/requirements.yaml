## 8. 项目范围与边界

### 8.1 功能范围

#### 8.1.1 核心功能（必须实现）

- 采购订单同步、关键物料标记、任务自动 / 手动下发；
- 生产计划编制（在线编辑 / Excel 导入）、校验、审批；
- 进度反馈填报、数据实时回传、任务状态更新；
- 角色权限配置（数据级 / 操作级权限）；
- 个人 / 供应商代办中心（待办提醒、一键跳转）；
- 数据监控看板（多维度统计、可视化）；
- 异常预警（阈值配置、提醒、处理、闭环）；
- 报表导出（订单、计划、交付、预警数据）。

#### 8.1.2 辅助功能（建议实现）

- 系统通知（站内信、待办提醒）；
- 操作日志查询（用户行为、数据变更）；
- 模板管理（Excel 导入 / 导出模板自定义）；
- 消息推送（预警、审批、任务下发推送至邮箱 / 企业微信）；
- 历史数据归档与查询。

### 8.2 非功能范围

#### 8.2.1 性能要求

- 并发能力：支持 100 + 用户同时在线操作，核心接口（如反馈提交、订单查询）支持 50 + 并发请求；
- 响应时间：页面加载时间 < 2 秒，接口响应时间 < 2 秒（批量导入 / 导出等异步操作除外）；
- 数据存储：支持至少 3 年的订单 / 计划 / 反馈数据存储，历史数据可归档至离线库；
- 可用性：系统全年可用率≥99.9%，故障恢复时间≤1 小时。

#### 8.2.2 安全性要求

- 数据加密：用户密码加盐哈希存储，敏感数据（如供应商联系方式、物料价格）传输与存储加密；
- 访问控制：支持 IP 白名单、登录失败次数限制（连续 5 次失败锁定账号 1 小时）；
- 审计日志：记录所有敏感操作（权限变更、订单下发、预警处理），日志不可篡改；
- 接口安全：API 接口支持签名验证，防止非法调用；跨域请求仅允许指定域名访问。

#### 8.2.3 可扩展性要求

- 模块扩展：支持后续新增「制造符合性检查管理」、「工序级计划管控」、「供应商评分」等模块，无需重构核心架构；
- 接口扩展：预留与 MES、PLM 等系统的集成接口，支持数据双向同步；
- 规则扩展：预警规则、任务下发规则支持可视化配置，无需修改代码；

#### 8.2.4 兼容性要求

- 浏览器兼容：支持 Chrome（≥90）、Firefox（≥88）、Edge（≥90）、Safari（≥14）；
- 设备兼容：支持 PC 端（分辨率≥1366×768）；
- 系统兼容：服务端支持 Windows Server 2019/2022、Linux（CentOS 7+/Ubuntu 20.04+）。

### 8.3 项目边界（明确不包含的内容）

- 不涉及 ERP 系统的功能修改，仅通过 API 同步数据；
- 不涉及供应商现场生产设备的数据采集（仅接收供应商手动 / Excel 导入的反馈数据）；
- 不提供移动端 APP 开发，仅支持移动端浏览器访问适配页面；
- 不包含制造符合性检查的具体业务逻辑（仅标记、存储相关数据，不参与检查流程）；
- 不负责第三方系统（如企业微信、邮箱）的接口开发，仅适配已有公开接口。