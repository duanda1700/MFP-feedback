# 产品需求文档（PRD）设计

## 1. 项目基本信息

项目名称：MFP-Feedback System

项目类型：制造计划回传系统

项目目标：采集发动机零部件制造过程数据，及时掌握订单制造进度，实现交付风险预警；追踪关键零部件制造状态，涵盖工序计划、制造符合性检查进展，确保过程可控，可追溯。

前端：Vue 3 + TypeScript + Vue-Vben-Admin 

后端：Nest.js + TypeScript 

数据库：MySQL 8.0

流程引擎：camunda 7.24

项目根目录 f:\mfback\MFP-feedback

## 2. 产品概述

### 2.1 产品背景

为及时掌握零部件试制过程进展，应对研制阶段采购延误风险，提升对供应商端制造现场掌握情况，同时，对适航取证过程制造符合性检查环节进行控制。设计并开发制造计划回传系统。

### 2.2 产品价值

1. 统一管理 ：平台集中分发研制订单及订单条目，各供应商合规获取，统一收集和管理各类反馈信息。
2. 高效处理 ：自动化流程和状态跟踪，提高供应商反馈处理效率
3. 数据驱动 ：通过数据分析，发现延期交付风险与改进机会

## 3. 核心功能模块

### 3.1 功能模块列表

制造计划回传系统拟划分5个核心功能模块，下方将明确各模块职责与功能，兼顾可扩展性、权限控制与流程闭环。

### 3.2 详细功能描述

### 3.2.1 采购订单下达与任务分发

职责与功能：基于ERP系统提供的API接口获取数据、自动生成承制任务、下发至供应商。

核心价值：实现任务精准、自动、可视分发。

#### 3.2.1.1 承制订单视图（一户一档、一单可视）

1. 集成ERP采购订单、人员信息、供应商信息主数据；

2. 按供应商维度展示承接任务清单（含状态：待接收/已接收/执行中/已完成），已完成状态可有采购主管手动关闭；

3. 支持订单明细穿透式查看（物料图号、数量、交货期、合同编号）。


#### 3.2.1.2 承制订单查询与筛选

1. 多维度组合查询：订单编号、物料图号、名称、数量、交货日期、状态等。

2. 支持模糊搜索、下拉选择、条件组合、导出报表。


#### 3.2.1.3 关键物料标记管理

1. 前端配置页面，支持对采购订单明细中的物料进行“关键件”标识；

2. 标记后自动同步至供应商任务清单，作为分解工序级计划管控执行项；

3. 标记规则有（高价值、长周期、制造符合性检查项目等，支持扩展）。


#### 3.2.1.4 任务自动下发

1. 基于规则引擎自动触发任务下发，以采购主管账号自动出发采购任务下发流程。


### 3.2.2 研制任务进展反馈

职责与功能：聚焦“供应商计划编制-执行反馈-数据回传”

核心价值：构建“计划-执行-反馈”闭环。

#### 子模块1：生产计划编制

#### 3.2.2.1生产计划视图

1. 列表展示所有任务（含任务名称、责任单位、计划开始、交付时间、关键物料标记）；

2. 支持按任务类型、单位、时间范围、关键件等筛选；

3. 可视化百分比展示整体完成率。


#### 3.2.2.2生产计划编排（提供在线编辑与导出功能）

1. 支持基于承制订单明细自动生成生产计划（在订单明细数据基础上增加责任人、计划完成时间、计划状态、备注等信息）；

2. 支持标准模板下载(excel),支持本地编辑后上传；


#### 3.2.2.3 计划导入与校验

1. 支持批量导入EXCEL文件；

2. 系统自动校验格式、逻辑一致性（如：任务缺失）；

3. 导入成功后更新计划视图，如失败则提示详细原因；

4. 导入成功后触发“生产计划制定流程”，由采购主管审批。


#### 子模块2：计划进度反馈

#### 3.2.2.4 进度反馈

1. 同屏双列表，左侧列表为承制订单（显示最上级单元体名称、所属台份、完成状态）、右侧为此订单下属计划明细反馈表。

2. 每个承制订单，对应一个反馈表单，明为计划明细反馈表，包含：计划编号、项目号、台份/型号有效性ID、零组件件号、零组件名称、数量、任务书编号、外采/自制状态、计划开始时间、计划结束时间、责任人、计划状态、备注、关键零部件标记、制造符合性检查零部件标记、制造符合性检查时间点，数据信息来自于生产计划编制模块编制的生产计划明细数据，责任人、计划状态、备注为历次需反馈可编辑信息。


##### 关键零部件标记、制造符合性检查标记

#### 3.2.2.5 反馈数据自动回传与状态更新

1. 供应商提交后，系统自动更新任务状态；

2. 回传数据可被“模块五：数据监控与闭环分析”实时监控，供人员实时查看，形成“执行反馈闭环”。


### 3.2.3 人员权限与组织管理

1. 支撑全系统安全可控运行，实现“谁可看、谁可操作、谁可审批”。


#### 3.2.3.1角色定义

1. 系统管理员（全局权限）

2. 采购主管（采购订单发生变更时创建/修改采购任务；审批供应商制定的“生产计划制定流程”；监控所管台份、单元体的制造交付情况）

3. 供应商负责人（查看本单位任务、填报进度）

4. 供应商操作人员（查看被分配任务、填报反馈）


#### 3.2.3.2权限粒度控制

1. 按组织层次控制数据可见范围（公司领导、采购与供应链管理部领导可查看全部数据；采购主管可查看所负责台份、专业数据；供应商负责人可查看本单位数据、供应商操作人员可查看所负责数据）

2. 按任务状态控制操作权限：未下发任务不可填报，已完成任务不可更改。

3. 支持”数据级权限“，


### 3.2.4 个人与供应商代办

#### 3.2.4.1 个人代办中心（面向采购主管、供应商操作人员）

1. 展示个人名下所有待处理任务，包括：新任务/变更任务接收提醒、计划编制待提交、进度反馈待填报、审批待处理

2. 支持一键跳转至对应操作流程。


#### 3.2.4.2供应商待办中心（面向供应商）

1. 仅展示分配给该供应商的任务：包括：任务接收确认、计划编制提交、进度反馈填报。

2. 提供清晰的代办事项列表、与优先级标识（关键零部件、制造符合性检查零部件标红）。


#### 3.2.4.3 流程状态可视

1. 每个任务在待办页面显示当前流程节点。


### 3.2.5：数据监控与闭环分析

支撑决策与持续优化，体现“闭环机制”的价值。

#### 3.2.5.1 任务执行看板

##### 一、核心统计指标（按**时间 / 供应商 / 台份 / 物料类型**多维度统计，支持自定义时间范围）

1. 订单条目统计：累计下发条目数、已完成条目数、执行中条目数、未开始条目数（含占比可视化）；
2. 订单变更统计：待发起变更条目数、已发起变更条目数、各订单变更次数及变更原因统计；
3. 承制单位交付统计：各单位承接条目数、完成条目数、**准时交付率 / 延期交付率**、平均交付周期；

##### 二、异常预警（支持**阈值自定义配置**，预警信息同步至待办中心 + 站内信提醒）

1. 进度预警：计划完成时间延迟 **≥3 天 ** 的任务，标红预警，关联对应采购主管与承制单位负责人；
2. 反馈预警：超过**24 小时**未提交进度反馈的任务，标黄预警，自动推送提醒至供应商操作人员；
3. 预警处理：支持预警任务一键跳转至处理页面，记录预警处理结果与闭环时间。

# 4. 页面设计与交互流程

## 4.1 全系统统一基础布局规范

基于 Vue-Vben-Admin 框架的基础布局体系，统一系统视觉风格与交互逻辑，具体规范如下：

1. **布局结构**：采用「顶部导航栏 + 左侧侧边栏 + 主内容区 + 底部信息栏」的经典布局；顶部导航栏展示系统名称、用户信息、全局通知、退出登录等功能；左侧侧边栏按功能模块划分菜单层级，支持折叠 / 展开；主内容区承载各模块核心操作与数据展示；底部信息栏展示系统版本、版权信息等。
2. **视觉规范**：统一配色体系（主色调：工业蓝 #1E88E5，辅助色：警示红 #FF5252、成功绿 #4CAF50，中性色：深灰 #333333、浅灰 #EEEEEE）；统一字体（正文：微软雅黑 / Inter，14px；标题：微软雅黑 / Inter Bold，16-24px）；统一组件样式（按钮、输入框、表格、弹窗等复用 Vue-Vben-Admin 内置样式，仅针对业务场景微调）。
3. **交互规范**：所有按钮、链接 Hover 状态有明确视觉反馈；表格支持列排序、固定列、行高亮；弹窗操作遵循「确认 / 取消」统一位置（确认居右、取消居左）；表单提交后有加载状态提示，操作结果（成功 / 失败）以 Toast / 弹窗形式反馈；支持键盘快捷键（如 Enter 提交表单、Esc 关闭弹窗）。

