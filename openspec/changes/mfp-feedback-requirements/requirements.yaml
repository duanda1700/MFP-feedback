## 4.3 核心交互流程

### 4.3.1 采购订单下达与任务分发流程

1. 系统定时调用 ERP API 接口，同步采购订单、人员、供应商主数据，**自动判断订单类型**（新订单 / 变更订单）；变更订单打「订单变更」红色标签并标注变更类型（数量调整 / 交货期修改 / 物料增删），新订单无特殊标记；
2. 采购主管登录系统，在「采购订单管理页」查看待处理订单，并对「新订单」或「变更订单」进行关键零部件标记与变更；
3. 采购主管确认后，**判断触发方式**（规则引擎自动触发 / 手动触发），生成对应承制任务：
   - 新订单：生成「新承制任务」；
   - 变更订单：生成「变更承制任务」（关联原任务编号，标注变更内容）；
4. 任务自动同步至供应商代办中心，**根据订单类型推送差异化提醒**：
   - 新订单：推送「新任务接收」普通提醒；
   - 变更订单：推送「订单变更重接收」红色高亮提醒；
5. 供应商负责人 / 操作人员在代办中心处理，**系统根据操作结果更新订单状态**：
   - 确认接收新订单：状态更新为「已接收」；
   - 确认接收变更订单：原订单状态更新为「已变更 - 待调整计划」；
   - 所有状态实时同步至采购订单管理页，采购端可实时查看供应商接收状态。

### 4.3.2 生产计划编制与审批流程

1. 供应商操作人员登录系统，在「生产计划编制页」查看任务，**系统自动判断任务类型**（新任务 / 变更任务）：

   - 新任务：基于承制订单明细自动生成对应生产计划条目，需在承制订单明细原数据的基础上补充外采/自制、责任人、计划完成时间、计划状态、备注等信息；

   - 变更任务：自动加载原生产计划，**仅解锁变更相关计划项**（新增物料需添加、数量 / 交货期变更需调整、删除物料自动归档），未变更项灰显不可改；

2. 供应商进行计划编辑，**系统根据任务类型提供差异化编辑方式**，除线上编辑外，均支持 Excel 模板操作：

   - 新任务：下载**标准空白模板**，本地编辑后批量上传；

   - 变更任务：下载**变更调整模板**（含原计划 + 变更项标注），支持原计划基础上行内编辑 / 模板上传；

3. 供应商提交计划后，**系统自动判断任务类型并执行差异化校验**：

   - 通用校验：格式合法性、逻辑一致性（如任务缺失、计划完成时间早于开始时间）；

   - 变更任务额外校验：调整内容与采购端下发的变更订单匹配度（如数量、交货期一致）；
   - 校验失败：提示具体错误原因 + 异常字段，驳回至编辑页；校验通过：触发对应审批流程；

4. 系统**根据任务类型触发差异化审批流程**，采购主管在「个人代办中心」收到对应提醒：

   - 新任务：触发「生产计划制定流程」，需审核全量计划信息；

   - 变更任务：触发「生产计划变更调整流程」，审批页自动对比「原计划 - 变更后计划」差异项（红色标注），仅需审核差异内容；

5. 采购主管完成审批，**系统根据审批结果 + 任务类型更新计划状态**：

   - 审批通过：

     - 新任务：状态更新为「已审批」，同步至进度反馈模块；

     - 变更任务：状态更新为「已变更 - 计划已审批」，自动覆盖原计划（原计划归档可查），同步至进度反馈模块；

   - 审批驳回：
     - 新任务：提示全量驳回原因，供应商需修改全量计划后重新提交；
     - 变更任务：针对差异项标注驳回原因，供应商仅需修改驳回的变更项后重新提交。

### 4.3.3 进度反馈与数据回传流程

1. 供应商操作人员在「进度反馈填报页」，左侧选择承制订单，**系统自动判断订单状态**（正常 / 已变更 - 计划已审批）：

   - 正常订单：展示全量计划明细反馈表，支持编辑责任人、计划状态、备注等可编辑字段；

   - 变更订单：展示计划明细反馈表并**自动标注变更项**（红色），区分原计划项 / 变更项；

2. 供应商编辑反馈信息，**系统根据计划项完成状态判断可编辑范围**（通用规则，适配所有订单类型）：

   - 已完成项：灰显不可改，保留原进度数据，标注「已完成 - 不可调整」；

   - 未开始 / 执行中项：支持正常编辑，变更订单的此类项需同步匹配变更后计划要求；

3. 供应商提交反馈后，**系统自动判断订单类型并更新状态 + 数据回传**：

   - 正常订单：按原有规则更新任务状态，数据实时回传至采购端；

   - 变更订单：状态更新为「已变更 - 进度同步中」，回传数据时附带「变更进度标识」，采购端可查看变更前后进度对比；

4. 采购主管在「采购订单管理页 / 数据监控看板页」查看反馈数据，**系统根据订单类型提供差异化监控能力**：

   - 正常订单：查看实时进度、完成率等基础数据；

   - 变更订单：额外查看「变更项进度完成率」「原计划与变更计划进度对比」；

5. 采购端若发现进度异常，可发起通用沟通提醒；**关键物料 / 制造符合性检查物料**（含变更后新增的此类物料），系统额外标记并同步至预警模块，触发基础预警规则。

### 4.3.4 异常预警与处理流程

1. 系统实时监控任务全生命周期数据，**自动判断预警触发类型**（基础预警 / 变更专属预警），所有预警阈值支持后台配置，触发后自动打标并推送：

   - 基础预警（原有）：进度延迟≥3 天、反馈超 24 小时未提交，触发级别「黄」；

   - 变更专属预警（新增）：

     ① 供应商超 24 小时未接收采购端变更订单，触发级别「黄」；

     ② 供应商接收变更后超 48 小时未提交计划调整申请，触发级别「黄」；

     ③ 变更计划审批通过后超 3 天未更新进度反馈，触发级别「黄」；

2. 预警信息同步至「数据监控看板页」+ 对应责任人「个人代办中心」，**系统根据预警类型做差异化展示**：

   - 基础预警：普通黄色标签展示，分散在看板对应统计模块；

   - 变更专属预警：红色「变更预警」标签高亮展示，在看板设立「订单变更预警专区」集中展示；

3. 责任人在代办中心点击预警任务，跳转至「预警处理页」，**系统根据预警类型展示差异化处理页面**：

   - 基础预警：展示任务进度详情、异常原因，责任人处理后填写通用处理说明；

   - 变更专属预警：展示订单变更详情、未处理节点、超时时长，责任人处理后需填写**变更专项处理说明**（如接收时间、调整计划完成时间）；

4. 责任人提交处理结果后，**系统判断预警类型并执行差异化闭环规则**：

   - 基础预警：审核处理结果后，更新预警状态为「已处理」，无需额外确认；

   - 变更专属预警：处理结果需同步至采购主管，**经采购主管确认后**，预警状态才更新为「已处理」；

5. 系统对未按时处理的预警自动升级，**根据预警类型设置差异化升级规则**：

   - 基础预警：超 7 小时未处理，由「黄」升「红」，推送至上级角色；

   - 变更专属预警：超 7 小时未处理，由「黄」升「红」，**直接推送至供应商负责人 + 采购主管 + 采购部门领导**，并在看板置顶展示，直至闭环。

### 4.3.5 全局统一规则

1. **最小化操作原则**：所有变更流程均保留原订单 / 计划数据，仅解锁变更相关项，避免重复操作；
2. **双向实时同步原则**：采购端的变更操作、供应商端的变更处理进度，双方数据实时同步，无信息差；
3. **差异化提醒原则**：所有变更相关任务、待办、预警均以红色标签 / 高亮展示，与正常流程明确区分；
4. **全操作留痕原则**：系统对所有变更相关操作自动记录，包括操作人、操作时间、操作内容、前后数据对比，记录不可删除、不可修改。

### 4.3.6 全流程追溯要求

1. 所有订单 / 计划的详情页，均嵌入 **「变更记录时间轴」**（按时间倒序展示），整合采购端 + 供应商端的所有变更操作记录，支持查看、截图、Excel 导出；
2. 系统在「数据监控与闭环分析模块」新增「订单变更统计报表」，支持按时间、供应商、变更类型、变更处理效率等维度统计，为采购端管理提供数据支撑；
3. 所有变更记录与原订单 / 计划数据**永久关联归档**，可通过订单编号、物料图号、任务编号多维度检索，满足制造行业过程可追溯、适航取证的合规要求。

## 5. 用户角色与权限

### 5.1 角色定义与核心权限

| 角色            | 核心权限                                                     | 数据可见范围                                                 |
| --------------- | ------------------------------------------------------------ | ------------------------------------------------------------ |
| 系统管理员      | 1. 全系统用户 / 角色 / 权限配置；2. 系统参数（预警阈值、规则引擎）配置；3. 数据备份 / 日志查看；4. 所有模块操作权限 | 全系统所有数据                                               |
| 采购主管        | 1. 采购订单查看 / 关键物料标记 / 任务下发；2. 生产计划审批；3. 所管任务进度监控；4. 预警处理 / 订单关闭；5. 报表导出 | 所负责台份、专业的采购订单、生产计划、反馈数据；全系统汇总级统计数据 |
| 供应商负责人    | 1. 本单位任务接收 / 确认；2. 本单位生产计划审核（提交前）；3. 本单位任务进度查看；4. 本单位预警处理 | 本单位承接的所有订单、计划、反馈数据；本单位相关的预警信息   |
| 供应商操作人员  | 1. 被分配任务的生产计划编制 / 导入；2. 进度反馈填报；3. 个人待办任务处理；4. 本岗位数据查看 | 被分配的订单、计划明细数据；本岗位相关的待办与预警信息       |
| 公司 / 部门领导 | 1.全系统数据监控看板查看；2. 订单 / 交付统计报表导出；3. 异常预警汇总查看；4. 无编辑 / 审批权限 | 全系统所有数据（仅查看权限）                                 |

### 5.2 权限控制规则

1. **数据级权限**：基于「组织 + 任务 + 角色」三维管控，如供应商仅能查看本单位承接的任务，采购主管仅能查看所负责台份的任务；

2. **操作级权限**：按任务状态控制，如未下发任务不可填报、已完成任务不可更改、审批中计划不可编辑；

3. **功能级权限**：系统管理员可配置所有功能，普通角色仅开放授权范围内的菜单与按钮（如供应商无用户管理权限）；

4. **权限继承**：高等级角色继承低等级角色权限（如公司领导可查看采购主管的所有数据，不可执行采购主管的审批操作）。

   ## 6. 业务逻辑描述

   ### 6.1 核心业务生命周期

   #### 6.1.1 采购订单生命周期

   1. 同步：从 ERP 同步至系统，状态为「待处理」；
   2. 标记：采购主管标记关键物料，状态为「待下发」；
   3. 下发：系统 / 手动触发下发，状态为「已下发」；
   4. 接收：供应商确认接收，状态为「已接收」；
   5. 执行：供应商编制计划、反馈进度，状态为「执行中」；
   6. 完成：供应商提交最终反馈，采购主管确认后手动关闭，状态为「已完成」；
   7. 归档：订单数据归档至历史库，支持查询与统计。

   #### 6.1.2 生产计划生命周期

   1. 生成：基于订单明细自动 / 手动生成，状态为「草稿」；
   2. 校验：系统校验导入 / 编辑的计划数据，状态为「待提交」；
   3. 提交：供应商提交计划，状态为「待审批」；
   4. 审批：采购主管审批通过 / 驳回（驳回则返回「草稿」），通过后状态为「已审批」；
   5. 执行：供应商反馈进度，状态随反馈更新（如「进行中」「已完成」）；
   6. 闭环：计划所有明细完成反馈，状态为「已闭环」。

   #### 6.1.3 预警生命周期

   1. 触发：系统检测到满足预警规则的任务，状态为「待处理」；
   2. 提醒：推送至责任人代办中心，按级别标黄 / 标红；
   3. 处理：责任人处理预警任务，记录结果，状态为「处理中」；
   4. 闭环：确认问题解决，状态为「已闭环」；超期未处理则升级预警，状态为「已升级」。

   ### 6.2 关键业务规则

   1. **关键物料标记规则**：支持按「高价值（单价≥XX 元）、长周期（制造周期≥XX 天）、制造符合性检查项目」等规则标记，标记后自动同步至供应商端，且在所有视图中突出展示；
   2. **任务下发规则**：基于「订单交货期 - 制造周期」自动计算下发时间，或采购主管手动指定；仅已标记关键物料的订单可触发自动下发；
   3. **计划校验规则**：校验计划完成时间≤订单交货期、责任人不能为空、关键物料计划明细不可缺失、台份 / 型号 ID 与主数据一致；
   4. **预警阈值规则**：进度预警阈值（延迟≥3 天）、反馈预警阈值（超 24 小时未提交）支持系统管理员自定义配置，不同供应商可配置差异化阈值；
   5. **数据回传规则**：供应商提交反馈后，数据实时回传（延迟≤5 分钟），且不可逆向修改（仅可补充备注）；已完成订单的反馈数据仅采购主管可导出；
   6. **权限生效规则**：角色权限配置后即时生效，用户需重新登录刷新权限；数据级权限按「最小授权原则」，仅开放完成工作必需的数据范围；
   7. **制造符合性检查规则**：标记为制造符合性检查的零部件，需额外反馈检查时间点，且检查完成后需上传检查报告附件，否则任务不可标记为「已完成」。

   ## 7. 技术实现要点

   ### 7.1 前端实现

   - **框架复用**：基于 Vue-Vben-Admin 开箱即用的组件（表格、表单、弹窗、导航等），减少重复开发；扩展业务组件（如双列表反馈组件、预警标记组件、进度可视化组件）；
   - **状态管理**：使用 Pinia 管理全局状态，按模块划分 store（如订单 Store、计划 Store、权限 Store、预警 Store），确保状态统一与响应式更新；
   - **API 请求**：封装 Axios 请求拦截器，统一处理 JWT 令牌校验、请求头设置、错误捕获（如网络异常、接口 401/403/500）；响应拦截器统一格式化返回数据，区分业务错误与系统错误；
   - **表单验证**：基于 VeeValidate / Element Plus 表单验证规则，封装通用验证方法（如物料图号格式、日期范围、数量正整数），支持自定义校验提示；
   - **数据可视化**：集成 ECharts 实现仪表盘、订单统计、交付率、预警趋势等图表，支持图表联动、下钻、导出图片 / Excel；
   - **文件处理**：使用 xlsx 库处理 Excel 导入 / 导出，支持批量导入时的错误详情导出（标注错误行与原因）；
   - **响应式适配**：基于 Vue-Vben-Admin 的适配方案，支持 PC 端不同分辨率（1366×768 及以上），关键页面适配平板端；
   - **缓存策略**：本地缓存用户权限、常用筛选条件、最近访问页面，减少接口请求；敏感数据（如令牌）存储在 sessionStorage，关闭标签页自动清除。

   ### 7.2 后端实现

   - **框架架构**：基于 Nest.js 模块化架构，划分核心模块（订单模块、计划模块、权限模块、预警模块、数据分析模块），模块间通过服务调用解耦；

   - **数据库设计**：

     - 核心表：采购订单表（存储 ERP 同步数据）、采购订单明细表（存储 ERP 同步数据）、生产计划表（关联采购订单明细表）、反馈数据表（存储供应商反馈）、角色权限表（存储角色与权限映射）、预警表（存储预警规则与状态）；
     - 表关联：通过订单编号、物料图号、供应商 ID 建立表间关联，使用外键保证数据一致性；
     - 索引设计：对订单编号、物料图号、任务状态、时间字段建立索引，提升查询效率；
     - 分表策略：历史订单数据（超过 1 年）分表存储，避免单表数据量过大。

   - **API 接口设计**：遵循 RESTful 规范，接口路径按模块划分（如 /api/order、/api/plan、/api/warning），支持分页、排序、筛选参数；提供接口文档（基于 Swagger）；

   - **认证授权**：

     - 身份认证：使用 JWT 生成令牌，令牌包含用户 ID、角色、过期时间，登录时签发，请求时校验；
     - 权限控制：基于 RBAC 模型，结合数据级权限（数据范围），在接口层拦截非授权访问；

   - **规则引擎**：集成 Camunda 7.24 流程引擎，配置任务下发、计划审批、预警触发等流程，支持流程节点自定义（如审批人、触发条件）；

   - **定时任务**：使用 Nest.js Schedule 模块，实现定时同步 ERP 数据（每小时）、定时检测预警规则（每分钟）、定时归档历史数据（每天凌晨）；

   - **日志系统**：使用 winston 记录系统日志，区分操作日志（用户行为）、业务日志（订单 / 计划状态变更）、错误日志（接口异常、流程失败），日志支持按时间 / 模块 / 级别查询；

   - **数据同步**：与 ERP 系统对接采用「定时同步 + 手动触发同步」双模式，同步失败时记录错误日志并推送提醒至系统管理员；

   - **性能优化**：接口响应时间控制在 2 秒内，批量导入 / 导出采用异步处理（返回任务 ID，完成后推送通知）；数据库查询使用分页、索引、联表优化，避免全表扫描。

